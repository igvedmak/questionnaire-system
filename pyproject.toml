[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "questionnaire"
version = "0.2.0"
description = "Questionnaire engine: templates, instances, answering, expression-based conditions, audit log, semantic free-text analytics."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "questionary>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
analytics = [
    "sentence-transformers>=3.0",
    "hdbscan>=0.8",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.scripts]
qst = "questionnaire.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["questionnaire*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "slow: end-to-end tests that spawn subprocesses (skip with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning:sentence_transformers",
]

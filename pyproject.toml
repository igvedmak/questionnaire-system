[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "questionnaire"
version = "0.1.0"
description = "Questionnaire templates, instances, answering, and filtering"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
qst = "questionnaire.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["questionnaire*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data                   # SQLite DB + PII key persisted on host
      - hf_cache:/root/.cache/huggingface  # model cache (avoids re-download on restart)
    environment:
      - QST_PII_KEY=${QST_PII_KEY:-}       # leave empty to auto-generate on first boot
      - HF_TOKEN=${HF_TOKEN:-}             # optional: avoids HuggingFace rate-limit warnings
      - QST_LLM_API_KEY=${QST_LLM_API_KEY:-}          # API key for chosen LLM provider
      - QST_LLM_MODEL=${QST_LLM_MODEL:-anthropic/claude-opus-4-7}  # litellm model string
      - QST_LLM_BASE_URL=${QST_LLM_BASE_URL:-}        # optional: for local/custom endpoints

  ui:
    build:
      context: ui
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  hf_cache:
